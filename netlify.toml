# Die Seite liegt im Unterordner site/ — ohne diese Angabe sucht Netlify
# im Repo-Wurzelverzeichnis nach index.html und liefert 404.
[build]
  publish = "site"

# Statische Seite, kein Build-Schritt nötig.

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
